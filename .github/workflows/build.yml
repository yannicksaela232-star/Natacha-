name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extrair o projeto da app
        run: |
          mkdir -p VIPUssd
          unzip -o vipussd-chatgpt-app-v31.zip -d VIPUssd

      - name: Compilar o APK
        working-directory: VIPUssd
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Guardar o log do erro
        if: always()
        working-directory: VIPUssd
        run: cp build.log ../build-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vip-ussd-apk
          path: VIPUssd/app/build/outputs/apk/debug/app-debug.apk
          
