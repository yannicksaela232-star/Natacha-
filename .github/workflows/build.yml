name: VIPUssd - Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VIPUssd
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          mkdir -p VIPUssd

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./VIPUssd/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Place the Android project ZIP in the repository root."
            exit 1
          fi

          echo "ZIP file found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d VIPUssd

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find VIPUssd -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "The ZIP may not contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project structure
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: Main Gradle build file not found."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Android project structure verified."

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VIPUssd-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VIPUssd-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
