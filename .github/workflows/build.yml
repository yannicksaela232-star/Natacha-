name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar o zip na raiz
        run: |
          if [ ! -f vipussd-chatgpt-app-v30.zip ]; then
            echo "ERRO: o vipussd-chatgpt-app-v30.zip não está na raiz do repositório."
            exit 1
          fi
          echo "Zip encontrado: $(ls -la vipussd-chatgpt-app-v30.zip)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extrair o projeto da app
        run: |
          mkdir -p VIPUssd
          unzip -o vipussd-chatgpt-app-v30.zip -d VIPUssd
          test -f VIPUssd/settings.gradle && echo "settings.gradle OK" || (echo "ERRO: settings.gradle em falta" && exit 1)

      - name: Compilar o APK
        working-directory: VIPUssd
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Resumo dos erros
        if: always()
        working-directory: VIPUssd
        run: |
          grep -E "error:|What went wrong|FAILURE|Could not|not found|Unresolved|cannot find" -A4 build.log > ../erros-resumo.txt || echo "Sem erros marcados." > ../erros-resumo.txt
          cp build.log ../build-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build-log.txt
            erros-resumo.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vip-ussd-apk
          path: VIPUssd/app/build/outputs/apk/debug/app-debug.apk
