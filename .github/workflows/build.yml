name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Extrair o projeto
        run: |
          mkdir -p VIPUssd
          unzip -o vipussd-chatgpt-app-v31.zip -d VIPUssd

      - name: Encontrar a pasta Android
        run: |
          PROJECT_DIR=$(find VIPUssd -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VIPUssd-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
